name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-env:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies (CPU only, CI 无 GPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install pennylane==0.42.3 pennylane-lightning==0.42.0
          pip install "numpy<2.0" "autoray==0.6.11"
          pip install scikit-learn opencv-python rasterio tqdm pandas matplotlib pillow pymupdf python-docx

      - name: Smoke test
        run: |
          python -c "
          import sys
          print('Python:', sys.version.split()[0])
          import numpy
          print('numpy:', numpy.__version__)
          import torch
          print('torch:', torch.__version__)
          import pennylane as qml
          print('PL:', qml.__version__)
          dev = qml.device('lightning.qubit', wires=4)
          @qml.qnode(dev)
          def c():
              qml.RY(0.5, wires=0)
              return qml.expval(qml.PauliZ(0))
          print('CPU qnode:', c())
          print('=== ENV OK ===')
          "

      - name: Syntax check all .py files
        run: |
          python -c "
          import ast, pathlib
          for f in pathlib.Path('experiments').rglob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  print(f'FAIL {f}: {e}')
                  raise
          for f in pathlib.Path('quanv4eo_modern').rglob('*.py'):
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  print(f'FAIL {f}: {e}')
                  raise
          print('All .py files syntactically valid.')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          ruff check quanv4eo_modern/ experiments/ --ignore=E501,F401
